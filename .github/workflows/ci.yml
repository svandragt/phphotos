name: CI
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - run: composer install --no-interaction --prefer-dist
      - name: PHP syntax lint
        run: |
          set -e
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l

  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
      - name: Install (compatibility check)
        run: composer install --no-interaction --prefer-dist

  ci:
    runs-on: ubuntu-latest
    needs: [lint, compat]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.lint.result }}" != "success" ] || [ "${{ needs.compat.result }}" != "success" ]; then
            echo "::error::lint or compat failed"; exit 1
          fi
